[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lambert_thesis"
version = "0.1.0"
description = "Library for the dissertation of S. Lambert (2025): Bayesian Inference in Stochastic Biological Systems, https://doi.org/10.53846/goediss-11359"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
